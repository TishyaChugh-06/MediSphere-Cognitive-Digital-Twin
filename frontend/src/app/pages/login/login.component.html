<div class="login-page">

  <div class="login-card">

    <div class="login-brand">

      <div class="brand-mark">
        MS
      </div>

      <div>
        <h1>MediSphere</h1>
        <p>Cognitive Digital Twin</p>
      </div>

    </div>


    <div class="login-heading">

      <h2>Welcome back</h2>

      <p>
        Sign in to access the MediSphere health platform.
      </p>

    </div>


    <form (submit)="$event.preventDefault(); login()">

      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          placeholder="Enter username"
          [value]="username()"
          (input)="username.set($any($event.target).value)"
        />

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Enter password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
        />

      </div>


      @if (errorMessage()) {

        <p class="error-message">
          {{ errorMessage() }}
        </p>

      }


      <button
        type="submit"
        class="login-btn"
      >
        Sign In
      </button>

    </form>


    <div class="login-footer">

      <span>
        MediSphere Milestone 1
      </span>

      <span>
        FHIR R4 • MongoDB • Digital Twin
      </span>

    </div>

  </div>

</div>
